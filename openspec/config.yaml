schema: spec-driven

context: |
  Language:
  - Write narrative content in Simplified Chinese.
  - Keep technical terms like "API", "REST", "GraphQL", "MQTT", and "IPC" in English.
  - Code examples, commands, and file paths remain in English.
  Project: psdk-debug-front
  Purpose: Frontend and desktop console for debugging DJI Cloud API PSDK workflows over MQTT.
  Primary workflows:
  - Connect to an MQTT broker with broker URL, credentials, gateway_sn, and device_sn.
  - Subscribe to state/events/services_reply topics and visualize status.
  - Publish service commands for speaker and PSDK widget interactions.
  - Track command lifecycle with pending/success/failure/timeout statuses.
  - Run command sequences with delay, stop, and per-step result tracking.
  - Validate speaker_audio_play_start PCM URL input and show speaker/TTS play progress feedback.
  - In desktop runtime, read/save MQTT config through preload IPC without exposing Node APIs to renderer.
  Domain constraints:
  - Topic templates:
    - state: thing/product/{device_sn}/state
    - events: thing/product/{gateway_sn}/events
    - services: thing/product/{gateway_sn}/services
    - services_reply: thing/product/{gateway_sn}/services_reply
  - Env vars are defined in .env with VITE_ prefix.
  - Desktop config defaults come from .env and can be overridden by local config at userData/desktop-config.json.
  - Built-in widget configs live in public/widget-configs and can be overridden by uploaded widget_config.json.
  - Widget config registry is generated by scripts/generate-widget-config-registry.mjs.
  Technology stack:
  - React 19 + TypeScript 5 + Vite 7
  - Electron 40 + electron-vite 5 + electron-builder 26
  - MQTT.js for broker communication
  - Tailwind CSS 3 + PostCSS + Autoprefixer
  - ESLint 9 flat config + typescript-eslint + react-hooks + react-refresh
  Source layout:
  - src/main.tsx and src/App.tsx are web renderer entry/composition points.
  - src/hooks/useMqtt.ts contains MQTT connection and command lifecycle logic.
  - src/lib contains shared utilities (topic builders, widget helpers, ids, validation).
  - src/types contains PSDK payload, app model, and desktop API types.
  - src/components/app contains feature panels.
  - electron/main contains desktop lifecycle, single-instance handling, and IPC handlers.
  - electron/preload exposes safe desktop APIs to renderer via contextBridge.
  - electron/shared contains IPC channels, validation, and payload sanitization helpers.
  Build and quality:
  - Package manager: npm (package-lock.json committed)
  - Scripts:
    - npm run dev
    - npm run dev:desktop
    - npm run build
    - npm run build:desktop
    - npm run preview
    - npm run preview:desktop
    - npm run lint
  - predev/prebuild/prepreview and desktop variants run scripts/generate-widget-config-registry.mjs.
  Conventions:
  - TypeScript + React functional components.
  - Prefer 2-space indentation, single quotes, and no semicolons.
  - Hooks use useX naming and are placed in src/hooks.
  - Components and types use PascalCase.
  - Shared constants use SCREAMING_SNAKE_CASE.
  - Keep MQTT topic/payload contracts centralized in src/types and helper modules in src/lib.
  - Reuse existing panels/hooks/lib before creating new abstractions.
  - Desktop security defaults MUST stay strict: contextIsolation=true, nodeIntegration=false, sandbox=true.
  - Renderer-side desktop access MUST go through window.desktop typed APIs.
  - Keep Tailwind class groups readable and intentional.
  - Conventional Commits are required (feat:, fix:, chore:, docs:, refactor:, test:).
  Testing notes:
  - No test runner is configured currently.
  - If tests are introduced, place them under src and add npm run test.
  - Manual verification should cover MQTT connect/publish/reply/timeout and any desktop config persistence changes.

rules:
  proposal:
    - Focus on behavior changes and MQTT message-flow impact, not only UI copy updates.
    - Include Non-goals and explicit risks when changing topics, payload fields, timeouts, or desktop config persistence.
    - Call out any required .env additions or default value changes.
  design:
    - Describe publish/subscribe paths per topic and expected acknowledgements.
    - Define or update TypeScript types before implementation when payload contracts change.
    - Reuse existing hooks/lib/panels unless there is a clear reason to create new abstractions.
    - For desktop-related changes, describe IPC boundary, preload API changes, and main-process implications.
  tasks:
    - Break work into small, file-targeted tasks with clear acceptance outcomes.
    - Include verification tasks for npm run lint and affected build command(s): npm run build and/or npm run build:desktop.
    - Include manual verification for connect, command publish, reply handling, timeout behavior, and desktop config read/save when applicable.
  spec:
    - Use MUST/SHOULD/MAY wording for requirement clarity.
    - Specify error and timeout semantics for command and sequence execution changes.
    - Include acceptance criteria for both UI state and command log/feedback results.
